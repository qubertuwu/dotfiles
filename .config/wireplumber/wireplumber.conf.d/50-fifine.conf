monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-MV-SILICON_fifine_Headset.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.usb-MV-SILICON_fifine_Headset.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
      }
    }
  }
]
